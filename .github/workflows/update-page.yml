name: Update agents page

on:
  workflow_dispatch:
    inputs:
      run_llm:
        description: Run one short Qwen2.5-1.5B Q4 GGUF generation
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Record runner facts
        run: |
          echo "nproc=$(nproc)"
          uname -a
          free -h
          df -h
          python3 --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data dependencies
        run: pip install -r requirements.txt

      - name: Fetch market data and write site
        run: python agent.py --outdir site

      - name: Optional GGUF generation
        if: ${{ inputs.run_llm }}
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "pip_install_start=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pip install llama-cpp-python huggingface_hub
          echo "pip_install_end=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python agent.py --outdir site --llm-only

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
